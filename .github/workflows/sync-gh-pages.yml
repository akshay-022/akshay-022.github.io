name: Sync gh-pages with master

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gh-pages is a deploy target, not a development branch: mirror master onto it
      - name: Push master to gh-pages
        run: git push origin HEAD:gh-pages --force
